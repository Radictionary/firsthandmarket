name: tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-smoke:
    name: Supabase smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Skip if secrets missing
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret not set — skipping DB smoke test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline smoke test
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x backend/examples/test_pipeline.sh
          backend/examples/test_pipeline.sh

  agent-tests:
    name: Agent behavior tests
    runs-on: ubuntu-latest
    needs: db-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/agent/requirements.txt

      - name: Install deps
        run: pip install -r backend/agent/requirements.txt

      - name: Skip if secrets missing
        id: gate
        env:
          OXEN_API_KEY: ${{ secrets.OXEN_API_KEY }}
        run: |
          if [ -z "$OXEN_API_KEY" ]; then
            echo "OXEN_API_KEY secret not set — skipping agent tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent test suite
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OXEN_API_KEY: ${{ secrets.OXEN_API_KEY }}
          OXEN_BASE_URL: ${{ secrets.OXEN_BASE_URL }}
          OXEN_MODEL: ${{ secrets.OXEN_MODEL }}
        working-directory: backend
        run: python agent/test_agent.py
